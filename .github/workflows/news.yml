name: Cập nhật tin tức ngành điện

on:
  schedule:
    - cron: "0 23 * * *"   # 06:00 giờ Việt Nam
    - cron: "0 7 * * *"    # 14:00 giờ Việt Nam
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_news.py
      - .github/workflows/news.yml

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lấy tin
        run: python scripts/fetch_news.py
      - name: Lưu kết quả
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then echo "Không có tin mới"; exit 0; fi
          git commit -m "Cập nhật tin tức $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
